*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{

.disp{font-family:'Space Grotesk','Inter',sans-serif}

/* Masthead */
header{

}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;

h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;
  margin:4px 0 2px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:#BFE0DC}
.bar{margin-top:14px;height:9px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sand),#F2C879);transition:width .35s ease}
.barlbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.barlbl b{font-family:'Space Grotesk',sans-serif;font-size:15px}
.barlbl span{font-size:11.5px;color:#BFE0DC}

/* Toolbar */
.tools{position:sticky;top:0;z-index:20;background:var(--paper);

.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;

.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--mut);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;font-family:inherit;
  white-space:nowrap}
.chip .n{opacity:.6;font-weight:600;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* List */
.list{padding:12px 12px 0;display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 14px 12px;box-shadow:0 1px 2px rgba(12,36,33,.04)}
.card.nophone{background:linear-gradient(0deg,#fff,#fff),var(--no);
  background-blend-mode:normal;border-color:var(--no-line);
  box-shadow:inset 4px 0 0 var(--no-line)}
.card.done{border-color:var(--ok-soft)}
.top{display:flex;gap:11px;align-items:flex-start}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--teal-soft);
  color:var(--teal-d);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.card.nophone .num{background:var(--no);color:#9A4A24}
.head{flex:1;min-width:0}
.prom{font-weight:600;font-size:15px;line-height:1.25;letter-spacing:-.005em}
.proj{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--teal);margin-top:2px}
.check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.check svg{opacity:0;transform:scale(.6);transition:.18s}
.card.done .check{background:var(--ok);border-color:var(--ok)}
.card.done .check svg{opacity:1;transform:scale(1)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin:9px 0 0;font-size:12.5px;color:var(--mut)}
.meta b{color:var(--text);font-weight:600}
.loc{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.4}
.row2{display:flex;gap:8px;margin-top:11px;align-items:center}
.tel{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;

  padding:11px;font-weight:600;font-size:14px;font-family:inherit}

.notel{flex:1;text-align:center;background:var(--no);color:#9A4A24;border-radius:11px;

.stat{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:11px;
  padding:11px 13px;font-weight:600;font-size:13px;font-family:inherit;color:var(--text);
  display:flex;align-items:center;gap:7px;min-width:118px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.note{width:100%;margin-top:10px;border:1px dashed var(--line);border-radius:11px;

  background:#FCFBF8}
.note:focus{outline:none;border-style:solid;border-color:var(--teal);background:#fff}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:14px}

footer{padding:22px 16px 8px;text-align:center}
.reset{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:10px;

.foot{font-size:11px;color:#9AA5A3;margin-top:12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

let state = load();
let filter = 'all', query = '';

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function rec(id){ return state[id] || (state[id]={done:false,status:'todo',note:''}); }
function hasPhone(d){ return d.tel && d.tel.trim()!==''; }

const $ = s=>document.querySelector(s);
const list=$('#list');

function matches(d){
  const r=rec(d.id);
  if(filter==='phone'&&!hasPhone(d))return false;
  if(filter==='nophone'&&hasPhone(d))return false;
  if(filter==='todo'&&r.done)return false;
  if(filter==='done'&&!r.done)return false;
  if(query){
    const h=(d.prom+' '+d.proj+' '+d.daira+' '+d.loc+' '+d.tel).toLowerCase();
    if(!h.includes(query))return false;
  }
  return true;
}

function render(){
  const rows=DATA.filter(matches);
  list.innerHTML='';
  if(!rows.length){
    list.innerHTML='<div class="empty">Aucun promoteur ne correspond.<br>Essaie un autre filtre ou efface la recherche.</div>';
  }
  for(const d of rows){
    const r=rec(d.id), ph=hasPhone(d), st=sMap[r.status]||sMap.todo;
    const card=document.createElement('div');
    card.className='card'+(ph?'':' nophone')+(r.done?' done':'');
    const tels=ph?d.tel.split('/').map(t=>t.trim()):[];
    const telHref=ph?('tel:'+tels[0].replace(/\s/g,'')):'';
    card.innerHTML=`
      <div class="top">
        <div class="num">${d.id}</div>
        <div class="head">
          <div class="prom">${esc(d.prom)}</div>
          <div class="proj">${esc(d.proj)}</div>
        </div>
        <button class="check" aria-label="Marquer traité">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
      <div class="meta"><span><b>${esc(d.daira)}</b></span><span>${esc(d.date)}</span></div>
      <div class="loc">${esc(d.loc)}</div>
      <div class="row2">
        ${ph
          ? `<a class="tel${tels.length>1?' multi':''}" href="${telHref}"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1z"/></svg>${tels.length>1?tels.length+' numéros':esc(tels[0])}</a>`
          : `<div class="notel">Pas de numéro</div>`}
        <button class="stat" data-cycle><span class="dot" style="background:${st.c}"></span>${st.label}</button>
      </div>
      <textarea class="note" rows="1" placeholder="Note (interlocuteur, suite à donner…)">${esc(r.note)}</textarea>
    `;
    card.querySelector('.check').onclick=()=>{r.done=!r.done;save();render();updateBar();};
    card.querySelector('[data-cycle]').onclick=()=>{
      const i=STATUSES.findIndex(s=>s.k===r.status);
      r.status=STATUSES[(i+1)%STATUSES.length].k;
      if(r.status!=='todo')r.done=r.done; save();render();
    };
    const ta=card.querySelector('.note');
    autosize(ta);
    ta.addEventListener('input',()=>{r.note=ta.value;autosize(ta);save();});
    list.appendChild(card);
  }
}

function counts(){
  let phone=0,nophone=0,done=0;
  for(const d of DATA){ hasPhone(d)?phone++:nophone++; if(rec(d.id).done)done++; }
  $('#c-all').textContent=DATA.length;
  $('#c-phone').textContent=phone;
  $('#c-nophone').textContent=nophone;
  $('#c-done').textContent=done;
  $('#c-todo').textContent=DATA.length-done;
  return {phone,nophone,done};
}
function updateBar(){
  const c=counts(), pct=Math.round(c.done/DATA.length*100);
  $('#fill').style.width=pct+'%';
  $('#ptxt').textContent=`${c.done} / ${DATA.length} traités`;
  $('#pno').textContent=`${c.nophone} sans numéro`;
}

function autosize(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,20)+'px';}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

$('#q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render();});
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
  filter=ch.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===ch));
  render();
});
$('#reset').onclick=()=>{
  if(confirm('Effacer toutes tes coches, statuts et notes ?')){
    state={};save();render();updateBar();
  }
};

render();updateBar();
</script>
</body>
</html>
